<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>🐉 AI 中国語コーチ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#060a12;--surface:#0b1320;--surface2:#101b2e;
  --border:rgba(255,255,255,0.07);
  --accent:#f97316;--accent2:#fb923c;--accent3:#34d399;
  --text:#fff7ed;--muted:#7a6a5a;--radius:16px;
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 80% 10%,rgba(220,60,30,0.09),transparent 70%),
    radial-gradient(ellipse 50% 50% at 10% 80%,rgba(249,115,22,0.07),transparent 70%);}

.app{max-width:680px;margin:0 auto;padding:0 16px 80px;position:relative;z-index:1;}

/* ── Tab bar ── */
.tab-bar{display:flex;position:sticky;top:0;z-index:100;
  background:rgba(6,10,18,0.92);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);margin:0 -16px;padding:0 16px;}
.tab-btn{flex:1;padding:14px 8px;background:none;border:none;color:var(--muted);
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.05em;
  cursor:pointer;position:relative;transition:color 0.2s;
  display:flex;align-items:center;justify-content:center;gap:6px;}
.tab-btn.active{color:var(--accent);}
.tab-btn.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;
  height:2px;background:var(--accent);border-radius:2px 2px 0 0;}
.tab-badge{background:var(--accent);color:#fff;border-radius:100px;
  font-size:10px;font-weight:800;padding:1px 6px;}

.page{padding:20px 0;display:none;}
.page.active{display:block;}

/* ── Header ── */
.header{text-align:center;padding:18px 0 22px;}
.hbadge{display:inline-flex;align-items:center;gap:6px;
  background:rgba(249,115,22,0.12);border:1px solid rgba(249,115,22,0.3);
  border-radius:100px;padding:4px 14px;font-size:11px;color:var(--accent);
  letter-spacing:0.1em;text-transform:uppercase;font-weight:600;margin-bottom:12px;}
.header h1{font-family:'Syne',sans-serif;font-size:clamp(22px,6vw,36px);font-weight:800;line-height:1.1;
  background:linear-gradient(135deg,#fff 0%,#fb923c 40%,#dc2626 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.header p{color:var(--muted);font-size:13px;margin-top:8px;line-height:1.6;}

/* ── Gal ── */
.gal-section{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-bottom:22px;}
.gal-bubble{background:linear-gradient(135deg,rgba(249,115,22,0.16),rgba(220,60,30,0.08));
  border:1px solid rgba(249,115,22,0.32);border-radius:16px 16px 16px 4px;
  padding:10px 16px;font-size:13px;color:#ffd6b0;max-width:220px;line-height:1.55;
  min-height:44px;display:flex;align-items:center;}

/* ── Mode toggle ── */
.mode-row{display:flex;gap:8px;margin-bottom:16px;}
.mode-btn{flex:1;padding:10px;background:none;border:1px solid rgba(255,255,255,0.1);
  color:var(--muted);border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;}
.mode-btn.active{border-color:rgba(249,115,22,0.5);color:var(--accent);background:rgba(249,115,22,0.08);}

/* ── Mic ── */
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:20px;}
.mic-ring{position:relative;width:120px;height:120px;cursor:pointer;
  user-select:none;-webkit-tap-highlight-color:transparent;}
.mic-ring svg.ring{position:absolute;inset:0;width:100%;height:100%;}
.mic-ring.recording svg.ring{animation:spin 3s linear infinite;}
.mic-btn{position:absolute;inset:10px;border-radius:50%;border:none;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 1px var(--border),0 8px 32px rgba(0,0,0,0.4);cursor:pointer;transition:all 0.3s;}
.mic-btn.recording{background:rgba(249,115,22,0.15);
  box-shadow:0 0 0 1px rgba(249,115,22,0.5),0 0 40px rgba(249,115,22,0.2);}
.mic-btn svg{width:32px;height:32px;}
.pulse-ring{position:absolute;inset:10px;border-radius:50%;
  border:2px solid var(--accent);opacity:0;pointer-events:none;}
.recording .pulse-ring{animation:pulse 1.5s ease-out infinite;}
.waveform{display:flex;align-items:center;gap:3px;height:28px;opacity:0;transition:opacity 0.3s;}
.waveform.visible{opacity:1;}
.waveform span{display:block;width:3px;background:var(--accent);border-radius:2px;height:4px;}
.waveform.anim span:nth-child(1){animation:bar .7s ease-in-out infinite .00s;}
.waveform.anim span:nth-child(2){animation:bar .7s ease-in-out infinite .10s;}
.waveform.anim span:nth-child(3){animation:bar .7s ease-in-out infinite .15s;}
.waveform.anim span:nth-child(4){animation:bar .7s ease-in-out infinite .05s;}
.waveform.anim span:nth-child(5){animation:bar .7s ease-in-out infinite .20s;}
.waveform.anim span:nth-child(6){animation:bar .7s ease-in-out infinite .12s;}
.waveform.anim span:nth-child(7){animation:bar .7s ease-in-out infinite .18s;}
.mic-status{font-size:13px;color:var(--muted);text-align:center;line-height:1.5;}
.mic-status.active{color:var(--accent);}

/* ── Transcript ── */
.transcript-box{background:var(--surface);border:1px solid rgba(249,115,22,0.3);
  border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.transcript-label{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;
  color:var(--muted);font-weight:600;margin-bottom:6px;}
.transcript-text{font-size:15px;line-height:1.65;color:var(--text);}

/* ── Text input ── */
.input-card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:14px;transition:border-color 0.2s;}
.input-card:focus-within{border-color:rgba(249,115,22,0.4);}
.input-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.input-label{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);font-weight:600;}
.char-count{font-size:11px;color:var(--muted);}
textarea{width:100%;background:none;border:none;outline:none;color:var(--text);
  font-size:15px;font-family:'DM Sans',sans-serif;resize:none;line-height:1.7;min-height:80px;}
textarea::placeholder{color:var(--muted);}

/* ── Chips ── */
.ex-label{font-size:11px;color:var(--muted);margin-bottom:8px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:100px;
  padding:5px 12px;font-size:12px;color:rgba(255,247,237,0.7);cursor:pointer;transition:all 0.15s;}
.chip:hover,.chip:active{border-color:rgba(249,115,22,0.4);color:var(--accent);background:rgba(249,115,22,0.08);}

/* ── Analyze btn ── */
.analyze-btn{width:100%;padding:15px;
  background:linear-gradient(135deg,rgba(220,38,38,0.2),rgba(249,115,22,0.2));
  border:1px solid rgba(249,115,22,0.4);border-radius:var(--radius);
  color:var(--accent);font-family:'Syne',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.05em;
  cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:20px;}
.analyze-btn:disabled{opacity:0.3;cursor:not-allowed;}
.analyze-btn:not(:disabled):hover{background:linear-gradient(135deg,rgba(220,38,38,0.32),rgba(249,115,22,0.32));}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.15);
  border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0;}

.error-box{background:rgba(255,100,100,0.08);border:1px solid rgba(255,100,100,0.25);
  border-radius:var(--radius);padding:14px;color:#ff9090;font-size:13px;
  margin-bottom:16px;line-height:1.6;display:none;}

/* ── Result cards ── */
.results{display:flex;flex-direction:column;gap:16px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;animation:fadeUp 0.4s ease both;}
.card:nth-child(2){animation-delay:.08s;}.card:nth-child(3){animation-delay:.16s;}
.card-header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);}
.card-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:14px;flex-shrink:0;}
.card-icon.red{background:rgba(220,38,38,0.15);}
.card-icon.orange{background:rgba(249,115,22,0.15);}
.card-icon.green{background:rgba(52,211,153,0.12);}
.card-title{font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;}
.card-title.red{color:#f87171;}
.card-title.orange{color:var(--accent);}
.card-title.green{color:var(--accent3);}
.card-body{padding:16px;}
.expr-item{background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:13px;margin-bottom:9px;}
.expr-item:last-child{margin-bottom:0;}
.expr-zh{font-size:15px;font-weight:500;color:var(--accent2);margin-bottom:3px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.expr-zh-text{flex:1;line-height:1.5;}
.expr-pinyin{font-size:12px;color:var(--accent3);margin-bottom:2px;font-style:italic;}
.expr-ja{font-size:12px;color:var(--muted);margin-bottom:7px;}
.expr-reason{font-size:11px;color:rgba(255,255,255,0.42);line-height:1.5;
  padding-top:7px;border-top:1px solid var(--border);}
.tts-btn{background:rgba(249,115,22,0.12);border:1px solid rgba(249,115,22,0.3);
  color:var(--accent);border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer;
  display:flex;align-items:center;gap:4px;flex-shrink:0;white-space:nowrap;transition:all 0.15s;}
.tts-btn.playing{color:#34d399;border-color:#34d399;background:rgba(52,211,153,0.12);}
.pron-item{margin-bottom:13px;padding-bottom:13px;border-bottom:1px solid var(--border);}
.pron-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
.pron-word{font-size:14px;color:var(--accent2);margin-bottom:4px;font-weight:600;}
.pron-pinyin{font-size:16px;color:var(--accent3);font-style:italic;margin-bottom:5px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pron-tip{font-size:12px;color:rgba(255,255,255,0.5);line-height:1.6;}
.pron-score{display:inline-flex;background:rgba(255,107,107,0.12);
  border:1px solid rgba(255,107,107,0.3);color:#ff9090;border-radius:100px;
  padding:2px 9px;font-size:10px;font-weight:600;margin-left:auto;}
.pron-score.ok{background:rgba(52,211,153,0.1);border-color:rgba(52,211,153,0.3);color:var(--accent3);}
.overall-score{display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px;background:var(--surface2);border-top:1px solid var(--border);}
.score-label{font-size:11px;color:var(--muted);}
.score-val{font-size:22px;font-weight:800;color:var(--accent);}
.score-bar-wrap{flex:1;height:4px;background:var(--border);border-radius:2px;margin:0 12px;overflow:hidden;}
.score-bar{height:100%;border-radius:2px;background:linear-gradient(90deg,#fb923c,#dc2626);
  transition:width 1s ease;width:0%;}
.no-issues{display:flex;align-items:center;gap:8px;color:var(--accent3);font-size:13px;padding:4px 0;}

/* ── Settings bar ── */
.settings-bar{display:none;}

/* ── History ── */
.history-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.history-header h2{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;}
.clear-btn{background:rgba(255,100,100,0.08);border:1px solid rgba(255,100,100,0.2);
  color:#ff9090;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;}
.history-empty{text-align:center;padding:56px 24px;color:var(--muted);}
.history-empty .ei{font-size:44px;margin-bottom:14px;opacity:.35;}
.history-empty p{font-size:13px;line-height:1.7;}
.history-list{display:flex;flex-direction:column;gap:9px;}
.hcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:border-color 0.2s;}
.hcard:hover{border-color:rgba(249,115,22,0.35);}
.hcard.open{border-color:rgba(249,115,22,0.4);}
.hcard-top{display:flex;align-items:center;gap:11px;padding:13px;}
.score-circle{width:40px;height:40px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:2px solid;}
.score-circle.high{color:var(--accent);border-color:rgba(249,115,22,0.45);background:rgba(249,115,22,0.1);}
.score-circle.mid{color:#fb923c;border-color:rgba(251,146,60,0.4);background:rgba(251,146,60,0.08);}
.score-circle.low{color:#ff9090;border-color:rgba(255,100,100,0.35);background:rgba(255,100,100,0.08);}
.hcard-info{flex:1;min-width:0;}
.hcard-tr{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.hcard-meta{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;}
.chevron{color:var(--muted);transition:transform 0.25s;flex-shrink:0;}
.hcard.open .chevron{transform:rotate(180deg);}
.hcard-detail{border-top:1px solid var(--border);max-height:0;overflow:hidden;transition:max-height 0.4s ease;}
.hcard.open .hcard-detail{max-height:1400px;}
.hcard-detail-inner{padding:13px;display:flex;flex-direction:column;gap:13px;}
.det-title{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;
  color:var(--muted);font-weight:600;margin-bottom:6px;}
.det-expr{background:var(--surface2);border-radius:10px;padding:9px 11px;margin-bottom:6px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:7px;}
.det-expr:last-child{margin-bottom:0;}
.det-zh{font-size:14px;color:var(--accent2);font-weight:500;margin-bottom:1px;}
.det-pinyin{font-size:11px;color:var(--accent3);font-style:italic;}
.det-ja{font-size:11px;color:var(--muted);}
.det-pron{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--border);}
.det-pron:last-child{border-bottom:none;}
.det-pw{font-size:13px;color:var(--accent2);width:60px;flex-shrink:0;}
.det-ipa{font-size:13px;color:var(--accent3);font-style:italic;flex:1;}
.det-fb{font-size:12px;color:rgba(255,255,255,0.55);line-height:1.7;}

@keyframes galBounce{from{transform:translateY(0);}to{transform:translateY(-7px);}}
@keyframes sparklePop{0%,100%{opacity:.4;transform:scale(.8);}50%{opacity:1;transform:scale(1.2);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{0%{opacity:.7;transform:scale(1);}100%{opacity:0;transform:scale(1.6);}}
@keyframes bar{0%,100%{height:4px;}50%{height:22px;}}
</style>
</head>
<body>

<div id="main-app">
<div class="app">

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-practice" onclick="switchTab('practice')">🎙 練習</button>
    <button class="tab-btn" id="tab-history" onclick="switchTab('history')">
      📋 履歴<span class="tab-badge" id="badge" style="display:none">0</span>
    </button>
  </div>

  <!-- ── Practice page ── -->
  <div class="page active" id="page-practice">

    <div class="header">
      <div class="hbadge">🐉 AI 中国語コーチ</div>
      <h1>話して、磨く。<br>中国語スピーキング</h1>
      <p>マイクで話すか中国語を入力すると AI がフィードバック！</p>
    </div>

    <div class="gal-section">
      <div id="gal-svg"></div>
      <div class="gal-bubble" id="gal-bubble">中国語、一緒に頑張ろう！加油～🐉</div>
    </div>

    <div class="mode-row">
      <button class="mode-btn active" id="mode-mic" onclick="setMode('mic')">🎙 マイク</button>
      <button class="mode-btn" id="mode-text" onclick="setMode('text')">✏️ テキスト入力</button>
    </div>

    <!-- MIC panel -->
    <div id="panel-mic">
      <div class="mic-wrap">
        <div class="mic-ring" id="mic-ring" onclick="toggleRecording()">
          <svg class="ring" viewBox="0 0 120 120" fill="none">
            <circle id="ring-circle" cx="60" cy="60" r="54"
              stroke="rgba(255,255,255,0.07)" stroke-width="2"
              stroke-dasharray="7 5" stroke-linecap="round"/>
          </svg>
          <div class="pulse-ring"></div>
          <button class="mic-btn" id="mic-btn">
            <svg id="mic-icon" viewBox="0 0 24 24" fill="none">
              <rect x="9" y="2" width="6" height="12" rx="3" fill="#fff7ed"/>
              <path d="M5 10a7 7 0 0014 0" stroke="#fff7ed" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="12" y1="17" x2="12" y2="21" stroke="#fff7ed" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="8" y1="21" x2="16" y2="21" stroke="#fff7ed" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="waveform" id="waveform">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
        <p class="mic-status" id="mic-status">タップして録音開始</p>
      </div>

      <div id="transcript-wrap" style="display:none;">
        <div class="transcript-box">
          <div class="transcript-label">認識結果</div>
          <div class="transcript-text" id="transcript-text"></div>
        </div>
      </div>
    </div>

    <!-- TEXT panel -->
    <div id="panel-text" style="display:none;">
      <p class="ex-label">例文をタップして試してみてね</p>
      <div class="chips" id="example-chips"></div>
      <div class="input-card">
        <div class="input-top">
          <span class="input-label">中国語を入力</span>
          <span class="char-count"><span id="char-n">0</span>/400</span>
        </div>
        <textarea id="text-input" rows="3"
          placeholder="例：我昨天去超市买了一些零食。"
          oninput="onTextInput()"></textarea>
      </div>
    </div>

    <div class="error-box" id="error-box"></div>

    <button class="analyze-btn" id="analyze-btn" onclick="doAnalyze()" disabled>
      🐉 AI で分析する
    </button>

    <div id="results"></div>

    <div class="settings-bar"></div>
  </div>

  <!-- ── History page ── -->
  <div class="page" id="page-history">
    <div class="history-header">
      <h2>練習履歴</h2>
      <button class="clear-btn" onclick="clearHistory()">全削除</button>
    </div>
    <div id="history-list"></div>
  </div>

</div><!-- .app -->
</div><!-- #main-app -->

<script>
// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
const STORAGE_KEY = 'chinese_coach_history_v1';
const EXAMPLES = [
  "我昨天去超市买了一些零食。",
  "你能告诉我怎么去车站吗？",
  "我学中文已经三年了。",
  "今天天气真好，对吧？",
  "我很期待这个周末。",
  "我太累了，在电车上睡着了。",
];

let currentMode      = 'mic';
let phase            = 'idle';
let recognition      = null;
let restartCount     = 0;
let finalTranscript  = '';
let interimTranscript = '';
let history          = [];
let currentTtsBtn    = null;

// ═══════════════════════════════════════════════════════════
//  INIT / APP START
// ═══════════════════════════════════════════════════════════
function startApp() {
  loadHistory();
  buildExampleChips();
  setGalMood('idle');
}

// ═══════════════════════════════════════════════════════════
//  GAL CHARACTER (dragon-themed)
// ═══════════════════════════════════════════════════════════
const GAL_MESSAGES = {
  idle:      '中国語、一緒に頑張ろう！加油～🐉',
  listening: '聞こえてるよ！話して♡',
  thinking:  '分析中〜！少し待って💦',
  happy:     'いい感じ！どんどん上手くなってる✨',
  praise:    'すごすぎ！完璧じゃん！！🔥🔥',
};

function galSVG(mood) {

function setGalMood(mood) {

// ═══════════════════════════════════════════════════════════
//  TABS / MODE
// ═══════════════════════════════════════════════════════════
function switchTab(tab) {
  ['practice','history'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    document.getElementById('page-' + t).classList.toggle('active', t === tab);
  });

}

function setMode(m) {
  currentMode = m;
  document.getElementById('mode-mic').classList.toggle('active', m === 'mic');
  document.getElementById('mode-text').classList.toggle('active', m === 'text');
  document.getElementById('panel-mic').style.display  = m === 'mic'  ? '' : 'none';
  document.getElementById('panel-text').style.display = m === 'text' ? '' : 'none';
  if (m === 'text' && phase === 'recording') stopRecording();
  updateAnalyzeBtn();
}

// ═══════════════════════════════════════════════════════════
//  SPEECH RECOGNITION
// ═══════════════════════════════════════════════════════════
function setRecordingUI(rec) {
  const ring   = document.getElementById('mic-ring');
  const btn    = document.getElementById('mic-btn');
  const circle = document.getElementById('ring-circle');
  const wave   = document.getElementById('waveform');
  const status = document.getElementById('mic-status');
  const icon   = document.getElementById('mic-icon');

  ring.classList.toggle('recording', rec);
  btn.classList.toggle('recording', rec);
  wave.classList.toggle('visible', rec);
  wave.classList.toggle('anim', rec);
  circle.setAttribute('stroke', rec ? 'rgba(249,115,22,0.7)' : 'rgba(255,255,255,0.07)');

  if (rec) {
    icon.innerHTML = `<rect x="6" y="6" width="4" height="12" rx="1" fill="#f97316"/>
      <rect x="14" y="6" width="4" height="12" rx="1" fill="#f97316"/>`;
    status.className = 'mic-status active';
    status.textContent = '🔴 録音中… もう一度タップで停止';
  } else {
    icon.innerHTML = `<rect x="9" y="2" width="6" height="12" rx="3" fill="#fff7ed"/>
      <path d="M5 10a7 7 0 0014 0" stroke="#fff7ed" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="12" y1="17" x2="12" y2="21" stroke="#fff7ed" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="8" y1="21" x2="16" y2="21" stroke="#fff7ed" stroke-width="1.5" stroke-linecap="round"/>`;
    status.className = 'mic-status';
  }
}

function startRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showError('このブラウザは音声認識非対応です。Chrome をお使いください。');
    phase = 'idle'; setGalMood('idle'); return;
  }
  finalTranscript = '';
  interimTranscript = '';
  restartCount = 0;

  function createAndStart() {
    const rec = new SR();
    rec.lang = 'zh-CN';
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;

    rec.onresult = (e) => {
      interimTranscript = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript;
        else interimTranscript += e.results[i][0].transcript;
      }
      updateTranscriptDisplay();
    };

    rec.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        showError('マイクが許可されていません。アドレスバーの 🔒 → マイク → 「許可」を選んでページをリロードしてください。');
        stopRecording();
      }
    };

    rec.onend = () => {
      if (phase === 'recording' && restartCount < 30) {
        restartCount++;
        setTimeout(() => {
          if (phase === 'recording') try { createAndStart(); } catch(_) {}
        }, 80);
      }
    };

    recognition = rec;
    rec.start();
  }
  createAndStart();
}

function stopRecording() {
  phase = 'idle';
  if (recognition) { try { recognition.stop(); } catch(_){} recognition = null; }
  setRecordingUI(false);
  interimTranscript = '';
  updateTranscriptDisplay();
  const status = document.getElementById('mic-status');
  status.textContent = finalTranscript.trim()
    ? '停止しました。↓ 分析ボタンを押してね♡'
    : 'タップして録音開始';
  setGalMood('idle');
  updateAnalyzeBtn();
}

function toggleRecording() {
  if (phase === 'recording') {
    stopRecording();
  } else if (phase === 'idle' || phase === 'result') {
    phase = 'recording';
    finalTranscript = '';
    interimTranscript = '';
    document.getElementById('transcript-wrap').style.display = 'none';
    document.getElementById('results').innerHTML = '';
    hideError();
    setRecordingUI(true);
    setGalMood('listening');
    startRecognition();
  }
}

function updateTranscriptDisplay() {
  const combined = (finalTranscript + interimTranscript).trim();
  const wrap = document.getElementById('transcript-wrap');
  const txt  = document.getElementById('transcript-text');
  if (combined) {
    wrap.style.display = '';
    txt.textContent = '\u300c' + combined + '\u300d';
  } else {
    wrap.style.display = 'none';
  }
  updateAnalyzeBtn();
}

// ═══════════════════════════════════════════════════════════
//  TEXT INPUT
// ═══════════════════════════════════════════════════════════
function buildExampleChips() {
  const wrap = document.getElementById('example-chips');
  wrap.innerHTML = EXAMPLES.map(ex =>
    `<div class="chip" onclick="useExample(this,'${esc(ex)}')">${esc(ex.slice(0,12))}…</div>`

function useExample(el, text) {

}
function onTextInput() {
  const val = document.getElementById('text-input').value.slice(0, 400);

// ═══════════════════════════════════════════════════════════
//  ANALYZE BUTTON STATE
// ═══════════════════════════════════════════════════════════
function updateAnalyzeBtn() {
  const btn = document.getElementById('analyze-btn');
  const micOk  = currentMode === 'mic'  && finalTranscript.trim().length > 0;
  const textOk = currentMode === 'text' && document.getElementById('text-input').value.trim().length > 0;
  btn.disabled = !(micOk || textOk) || phase === 'processing' || phase === 'recording';
}

// ═══════════════════════════════════════════════════════════
//  ANALYZE
// ═══════════════════════════════════════════════════════════
async function doAnalyze() {
  const text = currentMode === 'mic'
    ? finalTranscript.trim()
    : document.getElementById('text-input').value.trim();
  if (!text || phase === 'processing') return;

  phase = 'processing';
  hideError();
  document.getElementById('results').innerHTML = '';
  const btn = document.getElementById('analyze-btn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>分析中… 少し待って♡';
  setGalMood('thinking');

  const sys = `You are an expert Mandarin Chinese expression and pronunciation coach for Japanese learners.
Analyze the given Chinese text and respond with ONLY a single valid JSON object — no markdown, no extra text.
{"naturalExpressions":[{"chinese":"...","pinyin":"...","japanese":"...","reason":"..."}],"pronunciationIssues":[{"word":"...","pinyin":"...","tip":"...","severity":"high|medium|low"}],"overallScore":80,"generalFeedback":"..."}
Rules:
- naturalExpressions: 2-3 more natural/native Chinese alternatives with pinyin. Always at least 1.
- pronunciationIssues: characters/words Japanese speakers commonly mispronounce (tones, sounds). Empty array [] if none.
- overallScore: integer 0-100.
- reason/tip/generalFeedback: write in Japanese.
- pinyin must include tone marks (e.g. nǐ hǎo).`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2048,
        system: sys,
        messages: [{ role: 'user', content: `Chinese text: "${text}"` }]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || 'API ' + res.status);
    }

    const data  = await res.json();
    const raw   = (data.content || []).map(b => b.text || '').join('');
    const match = raw.match(/\{[\s\S]*\}/);
    if (!match) throw new Error('JSONが返ってきませんでした');
    const result = JSON.parse(match[0]);

    phase = 'result';
    btn.disabled = false;
    btn.innerHTML = '🐉 もう一度分析する';
    setGalMood(result.overallScore >= 75 ? 'praise' : 'happy');
    renderResult(result);

    const entry = {
      id: Date.now().toString(),
      transcript: text,
      result,
      createdAt: new Date().toISOString()
    };
    history.unshift(entry);
    if (history.length > 60) history.pop();
    saveHistory();
    updateBadge();

  } catch(e) {
    phase = 'idle';
    showError('エラー: ' + e.message);
    btn.disabled = false;
    btn.innerHTML = '🐉 AI で分析する';
    setGalMood('idle');
    updateAnalyzeBtn();
  }
}

// ═══════════════════════════════════════════════════════════
//  RENDER RESULT
// ═══════════════════════════════════════════════════════════
function renderResult(r) {
  let html = '<div class="results">';

  if (r.generalFeedback) {
    html += `<div class="card">
      <div class="card-header">
        <div class="card-icon red">💬</div>
        <div class="card-title red">総合フィードバック</div>
      </div>
      <div class="card-body">
        <p style="font-size:13px;line-height:1.75;color:rgba(255,247,237,0.75)">${esc(r.generalFeedback)}</p>
      </div>
      <div class="overall-score">
        <span class="score-label">スコア</span>
        <div class="score-bar-wrap"><div class="score-bar" id="sbar"></div></div>
        <span class="score-val">${r.overallScore}</span>
      </div>
    </div>`;
  }

  if (r.naturalExpressions?.length) {
    html += `<div class="card">
      <div class="card-header">
        <div class="card-icon orange">✨</div>
        <div class="card-title orange">より自然な表現</div>
      </div>
      <div class="card-body">`;
    r.naturalExpressions.forEach((ex, i) => {
      const safeZh = esc(ex.chinese).replace(/'/g, "\\'");
      html += `<div class="expr-item">
        <div class="expr-zh">
          <span class="expr-zh-text">${esc(ex.chinese)}</span>
          <button class="tts-btn" id="tts-ex-${i}"
            onclick="playTTS('${safeZh}','tts-ex-${i}')">🔊 聴く</button>
        </div>
        <div class="expr-pinyin">${esc(ex.pinyin || '')}</div>
        <div class="expr-ja">${esc(ex.japanese)}</div>
        <div class="expr-reason">💡 ${esc(ex.reason)}</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  html += `<div class="card">
    <div class="card-header">
      <div class="card-icon green">🗣</div>
      <div class="card-title green">発音フィードバック</div>
    </div>
    <div class="card-body">`;
  if (r.pronunciationIssues?.length) {
    r.pronunciationIssues.forEach((p, i) => {
      const sc  = p.severity === 'high' ? '要改善' : p.severity === 'medium' ? '注意' : '良好';
      const ok  = p.severity === 'low' ? ' ok' : '';
      const safeW = esc(p.word).replace(/'/g, "\\'");
      html += `<div class="pron-item">
        <div class="pron-word">${esc(p.word)}</div>
        <div class="pron-pinyin">
          <span>${esc(p.pinyin || '')}</span>
          <button class="tts-btn" id="tts-p-${i}"
            onclick="playTTS('${safeW}','tts-p-${i}')">🔊 正しい発音</button>
          <span class="pron-score${ok}">${sc}</span>
        </div>
        <div class="pron-tip">${esc(p.tip)}</div>
      </div>`;
    });
  } else {
    html += `<div class="no-issues">✅ 発音の大きな問題は検出されませんでした！</div>`;
  }
  html += `</div></div></div>`;

  document.getElementById('results').innerHTML = html;
  setTimeout(() => {
    const bar = document.getElementById('sbar');
    if (bar) bar.style.width = (r.overallScore || 0) + '%';
  }, 150);
}

// ═══════════════════════════════════════════════════════════
//  TTS
// ═══════════════════════════════════════════════════════════
function playTTS(text, btnId) {
  if (currentTtsBtn) {
    const prev = document.getElementById(currentTtsBtn);
    if (prev) { prev.classList.remove('playing'); prev.innerHTML = '🔊'; }
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.85;
  const btn = document.getElementById(btnId);
  if (btn) { btn.classList.add('playing'); btn.textContent = '▶ 再生中'; }
  currentTtsBtn = btnId;
  u.onend = u.onerror = () => {
    const b = document.getElementById(btnId);
    if (b) { b.classList.remove('playing'); b.innerHTML = '🔊'; }
    if (currentTtsBtn === btnId) currentTtsBtn = null;
  };
  window.speechSynthesis.speak(u);
}

// ═══════════════════════════════════════════════════════════
//  HISTORY
// ═══════════════════════════════════════════════════════════
function saveHistory() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch(_){}
}
function loadHistory() {
  try {
    const v = localStorage.getItem(STORAGE_KEY);
    if (v) history = JSON.parse(v);
  } catch(_){}
  updateBadge();
}
function updateBadge() {
  const b = document.getElementById('badge');
  if (history.length > 0) { b.style.display = ''; b.textContent = history.length; }
  else b.style.display = 'none';
}
function clearHistory() {
  if (!confirm('履歴をすべて削除しますか？')) return;
  history = [];
  saveHistory(); updateBadge(); renderHistory();
}
function formatDate(iso) {
  const d = new Date(iso), diff = (Date.now() - d) / 1000;
  if (diff < 60)    return 'たった今';
  if (diff < 3600)  return Math.floor(diff / 60) + '分前';
  if (diff < 86400) return Math.floor(diff / 3600) + '時間前';
  return Math.floor(diff / 86400) + '日前';
}
function scoreClass(s) { return s >= 75 ? 'high' : s >= 50 ? 'mid' : 'low'; }

function renderHistory() {
  const el = document.getElementById('history-list');
  if (!history.length) {
    el.innerHTML = `<div class="history-empty">
      <div class="ei">📭</div>
      <p>まだ練習の記録がないよ〜！<br>「練習」タブで中国語を話してみてね🐉</p>
    </div>`;
    return;
  }
  el.innerHTML = history.map((entry, idx) => {
    const sc  = scoreClass(entry.result.overallScore);
    const exN = entry.result.naturalExpressions?.length || 0;
    const pN  = entry.result.pronunciationIssues?.length || 0;
    return `<div class="hcard" id="hcard-${idx}" onclick="toggleHcard(${idx})">
      <div class="hcard-top">
        <div class="score-circle ${sc}">${entry.result.overallScore}</div>
        <div class="hcard-info">
          <div class="hcard-tr">「${esc(entry.transcript)}」</div>
          <div class="hcard-meta">
            <span>🕐 ${formatDate(entry.createdAt)}</span>
            <span>✨ ${exN}表現</span>
            ${pN > 0 ? `<span>🗣 ${pN}件</span>` : ''}
          </div>
        </div>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
      <div class="hcard-detail">
        <div class="hcard-detail-inner" onclick="event.stopPropagation()">
          ${entry.result.generalFeedback
            ? `<div><div class="det-title">💬 フィードバック</div>
               <div class="det-fb">${esc(entry.result.generalFeedback)}</div></div>` : ''}
          ${exN ? `<div><div class="det-title">✨ より自然な表現</div>
            ${entry.result.naturalExpressions.map((ex, i) => {
              const safeZh = esc(ex.chinese).replace(/'/g, "\\'");
              return `<div class="det-expr">
                <div>
                  <div class="det-zh">${esc(ex.chinese)}</div>
                  <div class="det-pinyin">${esc(ex.pinyin || '')}</div>
                  <div class="det-ja">${esc(ex.japanese)}</div>
                </div>
                <button class="tts-btn" id="htts-${idx}-${i}"
                  onclick="playTTS('${safeZh}','htts-${idx}-${i}')">🔊</button>
              </div>`;
            }).join('')}</div>` : ''}
          ${pN ? `<div><div class="det-title">🗣 発音チェック</div>
            ${entry.result.pronunciationIssues.map((p, i) => {
              const safeW = esc(p.word).replace(/'/g, "\\'");
              return `<div class="det-pron">
                <span class="det-pw">${esc(p.word)}</span>
                <span class="det-ipa">${esc(p.pinyin || '')}</span>
                <button class="tts-btn" id="hptts-${idx}-${i}"
                  onclick="playTTS('${safeW}','hptts-${idx}-${i}')">🔊</button>
              </div>`;
            }).join('')}</div>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleHcard(idx) {
  document.getElementById('hcard-' + idx)?.classList.toggle('open');
}

// ═══════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════
function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showError(msg) {
  const el = document.getElementById('error-box');
  el.style.display = '';
  el.textContent = '⚠️ ' + msg;
}
function hideError() {
  document.getElementById('error-box').style.display = 'none';
}
